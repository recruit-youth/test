<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>予約ありがとうございます | あなたの転職</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "YuGothic", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #fef2f2 0, #f5f7fb 55%, #eef2ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 18px 40px rgba(15, 23, 42, .15);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 12px;
    }

    .small {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }

    #calendar-area {
      margin-top: 24px;
      animation: fadeUp .18s ease-out;
    }

    .calendar-box {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .18);
      max-width: 420px;
      margin: 0 auto;
    }

    .calendar-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .weekday {
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 2px;
    }

    .date {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border-radius: 8px;
      background: #f3f4f6;
      cursor: pointer;
      border: 0;
    }

    .date.disabled {
      color: #9ca3af;
      background: #e5e7eb;
      cursor: not-allowed;
    }

    .date.selected {
      background: #ef4444;
      color: #fff;
    }

    .time-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
    }

    .time.disabled {
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .time.selected {
      background: #111827;
      color: #fff;
    }

    .confirm-btn {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .confirm-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>面談日程を選択してください</h1>
    <p>ご都合のよい日付と時間をお選びください。</p>

    <section id="calendar-area">
      <div class="calendar-box">
        <div class="calendar-title">候補日（直近14日）</div>
        <div class="calendar-grid" id="weekdayRow" aria-hidden="true"></div>
        <div class="calendar-grid" id="dateGrid" role="listbox" aria-label="日付選択"></div>
        <div class="calendar-title">時間帯</div>
        <div class="time-list" id="timeList" role="listbox" aria-label="時間選択"></div>
        <button id="confirmBtn" class="confirm-btn" disabled>この内容で確定する</button>
      </div>
    </section>

    <p class="small" id="selectionText">日付と時間を選ぶと確定ボタンが有効になります。</p>
  </main>

  <script>
    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
    const timeSlots = ["10:00", "11:00", "13:00", "15:00", "17:00", "19:00"];
    const disabledTimeMap = {
      0: ["10:00", "11:00"],
      6: ["17:00", "19:00"]
    };

    const weekdayRow = document.getElementById("weekdayRow");
    const dateGrid = document.getElementById("dateGrid");
    const timeList = document.getElementById("timeList");
    const confirmBtn = document.getElementById("confirmBtn");
    const selectionText = document.getElementById("selectionText");

    let selectedDate = null;
    let selectedTime = null;

    function formatDate(date) {
      return `${date.getMonth() + 1}/${date.getDate()}(${weekdays[date.getDay()]})`;
    }

    function renderWeekdays() {
      weekdays.forEach((day) => {
        const el = document.createElement("div");
        el.className = "weekday";
        el.textContent = day;
        weekdayRow.appendChild(el);
      });
    }

    function renderDates() {
      const today = new Date();
      for (let i = 0; i < 14; i += 1) {
        const date = new Date(today);
        date.setDate(today.getDate() + i);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date";
        btn.dataset.date = date.toISOString();
        btn.textContent = `${date.getDate()}`;
        btn.setAttribute("aria-label", formatDate(date));

        btn.addEventListener("click", () => {
          selectedDate = new Date(btn.dataset.date);
          selectedTime = null;
          [...dateGrid.children].forEach((node) => node.classList.remove("selected"));
          btn.classList.add("selected");
          renderTimes();
          updateSummary();
        });

        dateGrid.appendChild(btn);
      }
    }

    function renderTimes() {
      const day = selectedDate ? selectedDate.getDay() : null;
      const disabledTimes = disabledTimeMap[day] || [];
      timeList.innerHTML = "";

      timeSlots.forEach((slot) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "time";
        btn.textContent = slot;

        if (disabledTimes.includes(slot)) {
          btn.classList.add("disabled");
          btn.disabled = true;
        } else {
          btn.addEventListener("click", () => {
            selectedTime = slot;
            [...timeList.children].forEach((node) => node.classList.remove("selected"));
            btn.classList.add("selected");
            updateSummary();
          });
        }

        timeList.appendChild(btn);
      });
    }

    function updateSummary() {
      const isReady = Boolean(selectedDate && selectedTime);
      confirmBtn.disabled = !isReady;

      if (!selectedDate) {
        selectionText.textContent = "まず日付を選択してください。";
        return;
      }

      if (!selectedTime) {
        selectionText.textContent = `${formatDate(selectedDate)} の時間帯を選択してください。`;
        return;
      }

      selectionText.textContent = `選択中: ${formatDate(selectedDate)} ${selectedTime}`;
    }

    confirmBtn.addEventListener("click", () => {
      alert(`面談日程を確定しました: ${formatDate(selectedDate)} ${selectedTime}`);
    });

    renderWeekdays();
    renderDates();
    updateSummary();
  </script>
</body>
</html>
