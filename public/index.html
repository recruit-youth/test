<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>適職診断 | あなたの転職</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --c-text:#062832;--c-muted:#3d7a87;--c-border:#b2e8f0;--c-border-soft:#d9f4f8;
      --c-teal-50:#ecfeff;--c-teal-100:#cffafe;--c-teal-200:#a5f3fc;
      --c-teal-400:#22d3ee;--c-teal-500:#06b6d4;--c-teal-600:#0891b2;--c-teal-700:#0e7490;
      --grad-main:linear-gradient(135deg,#06b6d4 0%,#0d9488 100%);
      --grad-soft:linear-gradient(135deg,#cffafe 0%,#ccfbf1 100%);
      --grad-card:linear-gradient(160deg,#fff 0%,#f0fdfa 100%);
      --grad-hero:linear-gradient(160deg,#e8fffe 0%,#f0faff 50%,#ecfffb 100%);
      --shadow-md:0 8px 24px rgba(6,40,50,.10);--shadow-xl:0 32px 64px rgba(6,40,50,.18);
      --shadow-btn:0 8px 24px rgba(6,182,212,.32);--shadow-btn-hover:0 14px 32px rgba(6,182,212,.44);
      --radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;
      --font-body:'Noto Sans JP',sans-serif;--font-display:'DM Serif Display',serif;
      --font-mono:'Space Mono',monospace;
      --transition-fast:.14s cubic-bezier(.4,0,.2,1);--transition-base:.22s cubic-bezier(.4,0,.2,1);
      --transition-spring:.42s cubic-bezier(.34,1.56,.64,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--grad-hero);background-attachment:fixed;color:var(--c-text);line-height:1.75;font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased;}
    body.intro-active{overflow:hidden;}
    body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);opacity:.55;}
    body::before{width:700px;height:700px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(6,182,212,.22) 0%,transparent 70%);}
    body::after{width:600px;height:600px;bottom:-150px;right:-150px;background:radial-gradient(circle,rgba(16,185,129,.18) 0%,transparent 70%);}

    .intro-screen{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#e2fffe 0%,#ebfcff 50%,#f0fffb 100%);overflow:hidden;text-align:center;}
    .intro-card{position:relative;z-index:1;width:100%;max-width:480px;margin:auto;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-xl);padding:40px 36px 36px;box-shadow:var(--shadow-xl),0 0 0 1px rgba(6,182,212,.08);text-align:center;}
    .intro-title{font-family:var(--font-display);font-size:clamp(22px,5vw,28px);color:var(--c-teal-700);line-height:1.3;margin-bottom:10px;}
    .intro-sub{font-size:14px;color:var(--c-muted);line-height:1.8;margin-bottom:24px;}
    .intro-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:28px;}
    .intro-badge{font-size:11px;font-weight:500;padding:4px 12px;border-radius:var(--radius-pill);background:var(--grad-soft);border:1px solid var(--c-teal-200);color:var(--c-teal-700);}
    .intro-start-btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:var(--radius-pill);padding:14px 32px;font-size:15px;font-weight:700;font-family:var(--font-body);color:#fff;cursor:pointer;background:var(--grad-main);box-shadow:var(--shadow-btn);transition:transform var(--transition-base),box-shadow var(--transition-base);}
    .intro-start-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-btn-hover);}
    .intro-screen.is-hidden{display:none;}

    .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,4vw,40px) clamp(12px,4vw,32px) 80px;width:100%;}
    header{width:100%;max-width:720px;margin:0 auto 28px;display:flex;align-items:center;justify-content:space-between;}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .logo-mark{width:36px;height:36px;border-radius:12px;background:var(--grad-main);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(6,182,212,.3);}
    .logo-text{font-size:15px;font-weight:700;color:var(--c-text);}
    .card{width:100%;max-width:720px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px) saturate(1.3);border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-md);padding:32px 28px;position:relative;overflow:hidden;margin-bottom:20px;}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-main);}
    .progress-wrap{margin-bottom:28px;}
    .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .progress-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--c-teal-600);text-transform:uppercase;}
    .progress-pct{font-family:var(--font-mono);font-size:11px;color:var(--c-teal-600);}
    .progress-track{height:5px;border-radius:var(--radius-pill);background:var(--c-teal-100);overflow:hidden;}
    .progress-fill{height:100%;border-radius:var(--radius-pill);background:var(--grad-main);transition:width .4s cubic-bezier(.4,0,.2,1);}
    .part-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--c-teal-600);background:var(--c-teal-50);border:1px solid var(--c-teal-200);border-radius:var(--radius-pill);padding:3px 10px;margin-bottom:12px;}
    .section-title{font-size:clamp(17px,3vw,21px);font-weight:700;letter-spacing:-.02em;line-height:1.4;margin-bottom:20px;}
    .field{margin-bottom:20px;}
    .field-label{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px;letter-spacing:-.01em;}
    .req{font-size:13px;font-weight:700;color:#e11d48;}
    input[type=text],input[type=tel],input[type=email]{width:100%;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--c-border);font-size:14px;font-family:var(--font-body);outline:none;background:#fff;color:var(--c-text);}
    input:focus{border-color:var(--c-teal-500);box-shadow:0 0 0 3px rgba(6,182,212,.15);}
    .pill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .pill{border-radius:var(--radius-md);border:1.5px solid var(--c-border);padding:11px 10px;font-size:13px;font-weight:500;text-align:center;background:#fff;color:var(--c-muted);cursor:pointer;transition:all var(--transition-fast);line-height:1.4;min-height:44px;display:flex;align-items:center;justify-content:center;}
    .pill.is-active{background:var(--grad-soft);border-color:var(--c-teal-500);color:var(--c-teal-700);font-weight:700;}
    .actions{display:flex;justify-content:flex-end;margin-top:28px;}
    .btn-main{border:none;background:var(--grad-main);color:#fff;padding:12px 22px;border-radius:var(--radius-pill);font-weight:700;cursor:pointer;box-shadow:var(--shadow-btn);}
    .btn-main:disabled{opacity:.6;cursor:not-allowed;}
    .alert{display:none;padding:12px 14px;background:#fff0f4;color:#9f1239;border:1px solid #fda4af;border-radius:12px;margin-bottom:14px;font-size:13px;}
    .alert.show{display:block;}
    .result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px;}
    .result-head p{font-size:12px;color:var(--c-muted);}
    .company-grid{display:grid;gap:14px;}
    .company-card{border:1px solid var(--c-border-soft);background:var(--grad-card);border-radius:16px;padding:16px;}
    .company-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
    .company-name{font-size:17px;font-weight:700;line-height:1.4;}
    .company-meta{font-size:12px;color:var(--c-muted);}
    .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:#e6fffa;color:#0f766e;border:1px solid #99f6e4;white-space:nowrap;}
    .strengths{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
    .strength{font-size:11px;padding:4px 9px;border-radius:999px;background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd;}
    .company-actions{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .btn-sub{border:1px solid var(--c-teal-200);background:#fff;color:var(--c-teal-700);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;}
    .slots{display:none;margin-top:14px;padding-top:12px;border-top:1px dashed var(--c-border);}
    .slots.show{display:block;}
    .slots-days{display:grid;gap:12px;}
    .slots-date{font-size:12px;font-weight:700;color:var(--c-teal-700);}
    .slot-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
    .slot-btn{border:1px solid #99d5e0;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;}
    .slot-btn:hover{background:#ecfeff;}
    .status{font-size:12px;color:var(--c-muted);}
    .muted{color:var(--c-muted);font-size:12px;}
    .hidden{display:none!important;}
    @media(max-width:640px){
      .card{padding:22px 16px;}
      .company-row{flex-direction:column;}
      .actions{justify-content:stretch;}
      .btn-main{width:100%;}
    }
  </style>
</head>
<body class="intro-active">
  <section class="intro-screen" id="introScreen">
    <div class="intro-card">
      <h1 class="intro-title">あなたに合う転職先を<br>最短で見つける</h1>
      <p class="intro-sub">質問に答えるだけで、条件に合った3社をご提案。<br>そのまま面談日程まで調整できます。</p>
      <div class="intro-badges">
        <span class="intro-badge">最短3分</span>
        <span class="intro-badge">完全無料</span>
        <span class="intro-badge">日程調整まで完結</span>
      </div>
      <button class="intro-start-btn" id="introStartBtn">診断をはじめる</button>
    </div>
  </section>

  <main class="page">
    <header>
      <a class="logo" href="#">
        <span class="logo-mark">✓</span>
        <span class="logo-text">あなたの転職</span>
      </a>
    </header>

    <section class="card" id="questionCard">
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Step 1 / 2</span>
          <span class="progress-pct" id="progressText">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
      <span class="part-label">求職者ヒアリング</span>
      <h2 class="section-title">まずは転職条件を教えてください</h2>
      <div class="alert" id="formAlert"></div>
      <form id="questionForm">
        <div class="field">
          <label class="field-label" for="name">お名前 <span class="req">*</span></label>
          <input id="name" name="name" type="text" required placeholder="山田 太郎">
        </div>
        <div class="field">
          <label class="field-label" for="email">メールアドレス <span class="req">*</span></label>
          <input id="email" name="email" type="email" required placeholder="sample@example.com">
        </div>
        <div class="field">
          <label class="field-label" for="phone">電話番号 <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" required placeholder="09012345678">
        </div>
        <div id="questionFields"></div>
        <div class="actions">
          <button class="btn-main" id="recommendBtn" type="submit">3社を提案してもらう</button>
        </div>
      </form>
    </section>

    <section class="card hidden" id="resultCard">
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Step 2 / 2</span>
          <span class="progress-pct">100%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:100%"></div>
        </div>
      </div>
      <div class="result-head">
        <div>
          <span class="part-label">会社提案 & 日程調整</span>
          <h2 class="section-title">あなたにおすすめの3社です</h2>
          <p>各社の「日程を調整する」から空き枠を選択してください。</p>
        </div>
      </div>
      <div class="alert" id="bookingAlert"></div>
      <div class="company-grid" id="companyGrid"></div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
