<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約完了 | あなたの転職</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{
      --c-text:#062832;--c-muted:#3d7a87;--c-border:#b2e8f0;--c-teal-100:#cffafe;--c-teal-700:#0e7490;
      --grad-main:linear-gradient(135deg,#06b6d4 0%,#0d9488 100%);--grad-soft:linear-gradient(135deg,#e0f2fe 0%,#ccfbf1 100%);
      --shadow-md:0 8px 24px rgba(6,40,50,.10);--radius-lg:24px;--radius-md:16px;--radius-pill:999px;
      --font-body:'Noto Sans JP',sans-serif;--font-display:'DM Serif Display',serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font-body);background:linear-gradient(160deg,#e8fffe 0%,#f0faff 50%,#ecfffb 100%);color:var(--c-text);padding:20px;}
    .wrap{max-width:780px;margin:0 auto;}
    .card{margin-top:20px;background:rgba(255,255,255,.92);border-radius:var(--radius-lg);padding:28px;border:1px solid #fff;box-shadow:var(--shadow-md);}
    .badge{display:inline-flex;padding:5px 12px;border-radius:var(--radius-pill);background:var(--grad-soft);border:1px solid var(--c-border);color:var(--c-teal-700);font-size:12px;font-weight:700;margin-bottom:10px;}
    h1{font-family:var(--font-display);font-size:30px;line-height:1.3;margin-bottom:8px;}
    .muted{color:var(--c-muted);font-size:13px;}
    .list{margin-top:18px;display:grid;gap:12px;}
    .item{padding:14px;border:1px solid #d8f4f8;background:#f8feff;border-radius:var(--radius-md);}
    .item h3{font-size:17px;margin-bottom:6px;}
    .row{font-size:13px;color:var(--c-muted);}
    .section-title{font-size:18px;font-weight:700;margin-top:26px;margin-bottom:10px;}
    .answers{padding:14px;border:1px solid #d8f4f8;background:#fcffff;border-radius:var(--radius-md);display:grid;gap:6px;}
    .line-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;border:none;border-radius:var(--radius-pill);padding:12px 22px;font-size:14px;font-weight:700;color:#fff;background:var(--grad-main);text-decoration:none;}
    .error{margin-top:12px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:12px;padding:10px 12px;font-size:13px;display:none;}
    .error.show{display:block;}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="badge">予約完了</span>
      <h1>面談予約が完了しました</h1>
      <p class="muted">回答内容と予約情報を求職者一覧・会社一覧・Googleカレンダー連携対象へ反映しています。</p>
      <div class="error" id="errorBox"></div>

      <h2 class="section-title">あなたの予約一覧</h2>
      <div class="list" id="bookingList"></div>

      <h2 class="section-title">回答内容</h2>
      <div class="answers" id="answerList"></div>

      <a class="line-btn" id="lineButton" href="#" target="_blank" rel="noopener noreferrer">無料LINE登録へ進む</a>
    </section>
  </main>
  <script src="/bookings.js" defer></script>
</body>
</html>
